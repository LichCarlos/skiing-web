packages:
  - apps/*
  - packages/*
  - tooling/*

# 原生构建脚本默认关闭；按团队审核结果启用。
allowBuilds:
  sharp: false
  unrs-resolver: false

# 不自动补齐缺失 peer；不接受不兼容 peer 作为可安装状态。
strictPeerDependencies: true
autoInstallPeers: false
saveExact: true
minimumReleaseAgeExclude:
  - "@typescript-eslint/parser@8.71.0"
  - "@typescript-eslint/project-service@8.71.0"
  - "@typescript-eslint/scope-manager@8.71.0"
  - "@typescript-eslint/tsconfig-utils@8.71.0"
  - "@typescript-eslint/types@8.71.0"
  - "@typescript-eslint/typescript-estree@8.71.0"
  - "@typescript-eslint/visitor-keys@8.71.0"
  - "@tiptap/core@3.33.0"
  - "@tiptap/extension-blockquote@3.33.0"
  - "@tiptap/extension-bold@3.33.0"
  - "@tiptap/extension-bubble-menu@3.33.0"
  - "@tiptap/extension-bullet-list@3.33.0"
  - "@tiptap/extension-code-block@3.33.0"
  - "@tiptap/extension-code@3.33.0"
  - "@tiptap/extension-document@3.33.0"
  - "@tiptap/extension-dropcursor@3.33.0"
  - "@tiptap/extension-floating-menu@3.33.0"
  - "@tiptap/extension-gapcursor@3.33.0"
  - "@tiptap/extension-hard-break@3.33.0"
  - "@tiptap/extension-heading@3.33.0"
  - "@tiptap/extension-horizontal-rule@3.33.0"
  - "@tiptap/extension-image@3.33.0"
  - "@tiptap/extension-italic@3.33.0"
  - "@tiptap/extension-link@3.33.0"
  - "@tiptap/extension-list-item@3.33.0"
  - "@tiptap/extension-list-keymap@3.33.0"
  - "@tiptap/extension-list@3.33.0"
  - "@tiptap/extension-ordered-list@3.33.0"
  - "@tiptap/extension-paragraph@3.33.0"
  - "@tiptap/extension-strike@3.33.0"
  - "@tiptap/extension-table@3.33.0"
  - "@tiptap/extension-text@3.33.0"
  - "@tiptap/extension-underline@3.33.0"
  - "@tiptap/extensions@3.33.0"
  - "@tiptap/markdown@3.33.0"
  - "@tiptap/pm@3.33.0"
  - "@tiptap/react@3.33.0"
  - "@tiptap/starter-kit@3.33.0"
